    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/services/auth-service/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: auth-service
      OTEL_RESOURCE_ATTRIBUTES: "service.version=1.0.0,deployment.environment=development"
      PORT: "4001"
