# ─── Required: read ports from config ────────────────────────────────────────
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  NODE_ENV: development

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    otel-collector:
      condition: service_healthy
    loki:
      condition: service_started

services:
  # ════════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY STACK
  # ════════════════════════════════════════════════════════════════════════════

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./infrastructure/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:8889:8889"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      [
        --config.file=/etc/alertmanager/alertmanager.yaml,
        --storage.path=/alertmanager,
      ]
    volumes:
      - ./infrastructure/observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.3
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - ./infrastructure/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.3
    command: [-config.file=/etc/promtail/promtail.yaml]
    volumes:
      - ./infrastructure/observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor metricsSummary"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # BANKING MICROSERVICES
  # ════════════════════════════════════════════════════════════════════════════

