syntax = "proto3";
package banking.wallet;
option optimize_for = SPEED;

service WalletService {
  rpc GetWallet   (GetWalletRequest)  returns (GetWalletResponse);
  rpc TopUp       (TopUpRequest)      returns (TopUpResponse);
  rpc Spend       (SpendRequest)      returns (SpendResponse);
}
message GetWalletRequest  { string user_id = 1; }
message GetWalletResponse { string id = 1; string user_id = 2; int64 balance_minor = 3; string currency = 4; string status = 5; }
message TopUpRequest   { string user_id = 1; int64 amount_minor = 2; string idempotency_key = 3; }
message TopUpResponse  { bool success = 1; int64 new_balance_minor = 2; }
message SpendRequest   { string user_id = 1; int64 amount_minor = 2; string idempotency_key = 3; string description = 4; }
message SpendResponse  { bool success = 1; int64 new_balance_minor = 2; }
