syntax = "proto3";
package banking.transaction;
option optimize_for = SPEED;

service TransactionService {
  rpc GetTransaction   (GetTransactionRequest)  returns (GetTransactionResponse);
  rpc ListTransactions (ListTransactionsRequest) returns (ListTransactionsResponse);
}

message GetTransactionRequest  { string transaction_id = 1; }
message GetTransactionResponse {
  string id = 1; string user_id = 2; string account_id = 3; string type = 4;
  int64 amount_minor = 5; string currency = 6; string status = 7;
  string idempotency_key = 8; string created_at = 9;
}

message ListTransactionsRequest  { string account_id = 1; int32 page = 2; int32 limit = 3; }
message ListTransactionsResponse { repeated GetTransactionResponse transactions = 1; int32 total = 2; }
