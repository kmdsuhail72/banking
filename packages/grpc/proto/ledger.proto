syntax = "proto3";
package banking.ledger;
option optimize_for = SPEED;

service LedgerService {
  rpc RecordDoubleEntry  (RecordDoubleEntryRequest)  returns (RecordDoubleEntryResponse);
  rpc GetBalance         (GetLedgerBalanceRequest)   returns (GetLedgerBalanceResponse);
  rpc GetEntries         (GetEntriesRequest)         returns (GetEntriesResponse);
}

message LedgerEntry {
  string account_id = 1; string entry_type = 2; int64 amount_minor = 3;
  string currency = 4; string description = 5;
}

message RecordDoubleEntryRequest {
  string transaction_id    = 1;
  string idempotency_key   = 2;
  repeated LedgerEntry entries = 3;  // Must have exactly one DEBIT + one CREDIT
}
message RecordDoubleEntryResponse { bool success = 1; repeated string entry_ids = 2; }

message GetLedgerBalanceRequest  { string account_id = 1; }
message GetLedgerBalanceResponse { int64 balance_minor = 1; string currency = 2; string computed_at = 3; }

message GetEntriesRequest  { string account_id = 1; int32 limit = 2; }
message GetEntriesResponse {
  repeated LedgerEntryRecord entries = 1;
  message LedgerEntryRecord {
    string id = 1; string transaction_id = 2; string entry_type = 3;
    int64 amount_minor = 4; int64 balance_after_minor = 5; string created_at = 6;
  }
}
