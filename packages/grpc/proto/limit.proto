syntax = "proto3";
package banking.limit;
option optimize_for = SPEED;

service LimitService {
  rpc CheckLimit    (CheckLimitRequest)    returns (CheckLimitResponse);
  rpc RecordUsage   (RecordUsageRequest)   returns (RecordUsageResponse);
  rpc GetLimits     (GetLimitsRequest)     returns (GetLimitsResponse);
}

message CheckLimitRequest  { string account_id = 1; int64 amount_minor = 2; string transaction_type = 3; }
message CheckLimitResponse { bool allowed = 1; int64 remaining_daily_minor = 2; int64 remaining_monthly_minor = 3; string reason = 4; }

message RecordUsageRequest  { string account_id = 1; int64 amount_minor = 2; string transaction_type = 3; string transaction_id = 4; }
message RecordUsageResponse { bool success = 1; }

message GetLimitsRequest  { string account_id = 1; }
message GetLimitsResponse { int64 daily_limit_minor = 1; int64 monthly_limit_minor = 2; int64 used_today_minor = 3; int64 used_month_minor = 4; }
