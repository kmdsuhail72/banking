syntax = "proto3";
package banking.emi;
option optimize_for = SPEED;

service EmiService {
  rpc GetSchedule    (GetScheduleRequest)   returns (GetScheduleResponse);
  rpc RecordPayment  (RecordPaymentRequest) returns (RecordPaymentResponse);
}
message GetScheduleRequest  { string loan_id = 1; }
message EmiInstallment { int32 installment_no = 1; string due_date = 2; int64 emi_minor = 3; int64 principal_minor = 4; int64 interest_minor = 5; string status = 6; }
message GetScheduleResponse { repeated EmiInstallment installments = 1; int64 total_outstanding_minor = 2; }
message RecordPaymentRequest  { string loan_id = 1; int32 installment_no = 2; string transaction_id = 3; }
message RecordPaymentResponse { bool success = 1; int64 remaining_outstanding_minor = 2; }
