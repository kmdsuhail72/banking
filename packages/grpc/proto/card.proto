syntax = "proto3";
package banking.card;
option optimize_for = SPEED;

service CardService {
  rpc IssueCard      (IssueCardRequest)     returns (IssueCardResponse);
  rpc BlockCard      (BlockCardRequest)     returns (BlockCardResponse);
  rpc GetCard        (GetCardRequest)       returns (GetCardResponse);
  rpc SetLimit       (SetLimitRequest)      returns (SetLimitResponse);
}

message IssueCardRequest  { string user_id = 1; string account_id = 2; string card_type = 3; }
message IssueCardResponse { string card_id = 1; string masked_number = 2; string status = 3; string expiry = 4; }

message BlockCardRequest  { string card_id = 1; string reason = 2; }
message BlockCardResponse { bool success = 1; }

message GetCardRequest  { string card_id = 1; }
message GetCardResponse { string id = 1; string masked_number = 2; string status = 3; string card_type = 4; string expiry = 5; int64 daily_limit_minor = 6; }

message SetLimitRequest  { string card_id = 1; int64 daily_limit_minor = 2; }
message SetLimitResponse { bool success = 1; }
