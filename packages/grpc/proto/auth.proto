syntax = "proto3";
package banking.auth;
option optimize_for = SPEED;

service AuthService {
  rpc ValidateToken   (ValidateTokenRequest)   returns (ValidateTokenResponse);
  rpc GetUser         (GetUserRequest)         returns (GetUserResponse);
  rpc RevokeToken     (RevokeTokenRequest)     returns (RevokeTokenResponse);
}

message ValidateTokenRequest  { string token = 1; }
message ValidateTokenResponse { bool valid = 1; string user_id = 2; string email = 3; string role = 4; }

message GetUserRequest  { string user_id = 1; }
message GetUserResponse { string id = 1; string email = 2; string role = 3; string status = 4; bool email_verified = 5; }

message RevokeTokenRequest  { string user_id = 1; }
message RevokeTokenResponse { bool success = 1; }
