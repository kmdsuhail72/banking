kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: banking-chaos
networking:
  # Install an enforcing CNI before deploying the lab; kindnet does not enforce NetworkPolicy.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    labels: {chaos.banking.io/dedicated: "true"}
  - role: worker
    labels: {chaos.banking.io/dedicated: "true"}
  - role: worker
    labels: {chaos.banking.io/dedicated: "true"}
  - role: worker
    labels: {chaos.banking.io/dedicated: "true"}
