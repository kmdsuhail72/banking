          "expr": "count_over_time(up{job=~\"banking|banking-slo-probes\"}[30d]) / 259200"
        }
      ]
    },
    {
      "name": "banking.slo.alerts",
      "interval": "30s",
      "rules": [
        {
          "alert": "BankingSloFastBurn",
          "expr": "banking:slo_burn_rate:1h > 14.4 and banking:slo_burn_rate:5m > 14.4",
          "for": "2m",
          "labels": {
            "severity": "critical",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloFastBurn on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloSlowBurn",
          "expr": "banking:slo_burn_rate:6h > 6 and banking:slo_burn_rate:30m > 6",
          "for": "5m",
          "labels": {
            "severity": "warning",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloSlowBurn on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloBudgetExhausted",
          "expr": "banking:slo_budget_remaining_ratio:30d <= 0",
          "for": "5m",
          "labels": {
            "severity": "critical",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloBudgetExhausted on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloBudgetLow",
          "expr": "banking:slo_budget_remaining_ratio:30d < 0.25",
          "for": "15m",
          "labels": {
            "severity": "warning",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloBudgetLow on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloRecoveryOverdue",
          "expr": "banking_sli_outage_age_seconds > 900",
          "for": "1m",
          "labels": {
            "severity": "critical",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloRecoveryOverdue on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloObserverMissing",
          "expr": "absent(up{job=\"banking-slo-probes\"}) or up{job=\"banking-slo-probes\"} == 0 or time() - banking_sli_probe_last_timestamp_seconds > 45",
          "for": "1m",
          "labels": {
            "severity": "critical",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloObserverMissing on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloTransactionTelemetryMissing",
          "expr": "absent(banking_sli_operations_total{kind=\"transaction\",service=\"transaction-service\"})",
          "for": "15m",
          "labels": {
            "severity": "warning",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloTransactionTelemetryMissing on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        },
        {
          "alert": "BankingSloAuthenticationTelemetryMissing",
          "expr": "absent(banking_sli_operations_total{kind=\"authentication\",service=\"auth-service\"})",
          "for": "15m",
          "labels": {
            "severity": "warning",
            "team": "platform"
          },
          "annotations": {
            "summary": "BankingSloAuthenticationTelemetryMissing on {{ $labels.service }} {{ $labels.slo }}",
            "description": "Inspect the SLO dashboard and follow infrastructure/observability/SLO.md deployment policy."
          }
        }
      ]
    }
  ]
}
