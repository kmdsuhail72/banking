        {
          "record": "banking:slo_events:5m",
          "expr": "sum by (service) (increase(banking_sli_probe_total{job=\"banking-slo-probes\"}[5m]))",
          "labels": {
            "slo": "availability"
          }
        },
        {
          "record": "banking:slo_bad_events:5m",
          "expr": "clamp_min((sum by (service) (increase(banking_sli_probe_total{job=\"banking-slo-probes\"}[5m]))) - (sum by (service) (increase(banking_sli_probe_good_total{job=\"banking-slo-probes\"}[5m]))), 0)",
          "labels": {
            "slo": "availability"
          }
        },
        {
          "record": "banking:slo_error_ratio:5m",
          "expr": "banking:slo_bad_events:5m{slo=\"availability\"} / banking:slo_events:5m{slo=\"availability\"}",
          "labels": {
            "slo": "availability"
          }
        },
        {
          "record": "banking:slo_burn_rate:5m",
          "expr": "banking:slo_error_ratio:5m{slo=\"availability\"} / 0.0010000",
          "labels": {
            "slo": "availability"
          }
