global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
      timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: banking-incidents
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: [incident-management:4020]
  - job_name: banking-slo-probes
    static_configs:
      - targets: [slo-observer:9105]

  - job_name: banking
    static_configs:
      - targets: [host.docker.internal:3000]
        labels:
          service: api-gateway
          service_name: API Gateway
      - targets: [host.docker.internal:4001]
        labels:
          service: auth-service
          service_name: Auth Service
      - targets: [host.docker.internal:4002]
        labels:
          service: customer-service
          service_name: Customer Service
      - targets: [host.docker.internal:4003]
        labels:
          service: account-service
          service_name: Account Service
      - targets: [host.docker.internal:4004]
        labels:
          service: transaction-service
          service_name: Transaction Service
      - targets: [host.docker.internal:4005]
        labels:
          service: payment-service
          service_name: Payment Service
      - targets: [host.docker.internal:4006]
        labels:
          service: wallet-service
          service_name: Wallet Service
      - targets: [host.docker.internal:4007]
        labels:
          service: ledger-service
          service_name: Ledger Service
      - targets: [host.docker.internal:4008]
        labels:
          service: beneficiary-service
          service_name: Beneficiary Service
      - targets: [host.docker.internal:4009]
        labels:
          service: kyc-risk-service
          service_name: KYC Risk Service
      - targets: [host.docker.internal:4010]
        labels:
          service: notification-service
          service_name: Notification Service
      - targets: [host.docker.internal:4011]
        labels:
          service: reporting-service
          service_name: Reporting Service

  - job_name: otlp-metrics
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: tempo-metrics
    static_configs:
      - targets: [tempo:3200]
