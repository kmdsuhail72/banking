services:
  slo-observer:
    image: node:22-alpine
    command: [node, /app/observer.mjs]
    environment:
      SLO_PROBE_TOKEN: ${SLO_PROBE_TOKEN:-}
    volumes:
      - ./infrastructure/observability/slo/observer.mjs:/app/observer.mjs:ro
      - ./infrastructure/observability/slo/probes.json:/config/probes.json:ro
      - slo_observer_data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./infrastructure/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on: [tempo, loki]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      [
        --config.file=/etc/alertmanager/alertmanager.yaml,
        --storage.path=/alertmanager,
      ]
    volumes:
      - ./infrastructure/observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.3
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - ./infrastructure/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.3
    command: [-config.file=/etc/promtail/promtail.yaml]
    volumes:
      - ./infrastructure/observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor metricsSummary"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus, loki, tempo, alertmanager]
    restart: unless-stopped

volumes:
  slo_observer_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
