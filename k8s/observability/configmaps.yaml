---
# ── Prometheus ConfigMap (prometheus.yml) ────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
          timeout: 10s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # ── Banking microservices ─────────────────────────────────────────────
      - job_name: banking
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [banking]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ── OTel Collector spanmetrics/servicegraph ───────────────────────────
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector.observability.svc.cluster.local:8889]

      # ── Tempo self-metrics ────────────────────────────────────────────────
      - job_name: tempo
        static_configs:
          - targets: [tempo.observability.svc.cluster.local:3200]

      # ── kube-state-metrics (HPA, pod status, etc.) ───────────────────────
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.kube-system.svc.cluster.local:8080]

      # ── metrics-server (CPU/memory for HPA) ──────────────────────────────
      - job_name: metrics-server
        static_configs:
          - targets: [metrics-server.kube-system.svc.cluster.local:443]
        scheme: https
        tls_config:
          insecure_skip_verify: true

---
# ── Prometheus Alert Rules ConfigMap ─────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: observability
data:
  banking.yaml: |
{{ .Files.Get "rules/banking.yaml" | indent 4 }}

---
# ── Alertmanager ConfigMap ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'service', 'namespace']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'default-webhook'
      routes:
        - match:
            severity: critical
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 15m
          receiver: 'critical-webhook'
        - match:
            severity: warning
          group_wait: 30s
          repeat_interval: 4h
          receiver: 'default-webhook'
    receivers:
      - name: 'default-webhook'
        webhook_configs:
          - url: 'http://notification-service.banking.svc.cluster.local:4010/internal/alerts'
            send_resolved: true
      - name: 'critical-webhook'
        webhook_configs:
          - url: 'http://notification-service.banking.svc.cluster.local:4010/internal/alerts/critical'
            send_resolved: true
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

---
# ── Loki ConfigMap ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 200
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    ruler:
      alertmanager_url: http://alertmanager:9093
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
    analytics:
      reporting_enabled: false

---
# ── Tempo ConfigMap ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    http_api_prefix: ""
    server:
      http_listen_port: 3200
      log_level: warn
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    compactor:
      compaction:
        block_retention: 168h
    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: banking-k8s
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://prometheus.observability.svc.cluster.local:9090/api/v1/write
            send_exemplars: true
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
          generate_native_histograms: both
    querier:
      frontend_worker:
        frontend_address: 127.0.0.1:9095

---
# ── OTel Collector ConfigMap ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      filter/health:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.target"] == "/health"'
            - 'attributes["http.target"] == "/metrics"'
      attributes/privacy:
        actions:
          - key: http.url
            action: delete
          - key: url.full
            action: delete
          - key: url.query
            action: delete
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
      batch:
        timeout: 1s
        send_batch_size: 512
      resource:
        attributes:
          - key: service.name
            action: upsert
            from_attribute: service.name
          - key: k8s.namespace.name
            action: upsert
            from_attribute: k8s.namespace.name
          - key: k8s.pod.name
            action: upsert
            from_attribute: k8s.pod.name
    connectors:
      spanmetrics:
        namespace: traces
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: service.name
          - name: http.method
          - name: http.status_code
        exemplars:
          enabled: true
        metrics_flush_interval: 15s
      servicegraph:
        metrics_flush_interval: 15s
        dimensions:
          - http.method
          - http.status_code
        store:
          ttl: 2s
          max_items: 10000
    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
        enable_open_metrics: true
      loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: false
          job: true
        labels:
          attributes:
            service.name: service
            level: level
            traceId: traceId
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/health, attributes/privacy, batch]
          exporters: [otlp/tempo, spanmetrics, servicegraph]
        metrics:
          receivers: [otlp, spanmetrics, servicegraph]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [loki]
