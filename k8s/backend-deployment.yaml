apiVersion: apps/v1
kind: Deployment

metadata:
  name: banking-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: banking-backend

  template:
    metadata:
      labels:
        app: banking-backend

    spec:
      containers:
        - name: banking-backend

          image: banking-backend:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: MONGO_URI
              value: mongodb://mongodb-service:27017/bankingapp

            - name: JWT_SECRET
              value: mysecretkey