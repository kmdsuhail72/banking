---
# ══════════════════════════════════════════════════════════════════════════════
# PodDisruptionBudgets — Banking Microservices
#
# Strategy:
#  - Critical services (auth, transaction, payment): minAvailable: 1
#    → Kubernetes will never evict if only 1 pod is running
#  - Standard services: minAvailable: 1 (safe during node maintenance)
# ══════════════════════════════════════════════════════════════════════════════

# ── auth-service (critical — all login flows depend on this) ─────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: auth-service }
---
