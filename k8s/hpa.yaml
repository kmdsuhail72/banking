---
# ══════════════════════════════════════════════════════════════════════════════
# HorizontalPodAutoscalers — Banking Microservices
#
# Strategy:
#  - Scale on CPU (70%) AND memory (80%) — whichever hits first
#  - Min replicas: 2 (zero-downtime during a rolling update)
#  - Max replicas: 10 (prevent unbounded spend)
#  - Scale-down stabilization: 5m (avoid flapping)
# ══════════════════════════════════════════════════════════════════════════════

# ── auth-service ─────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
