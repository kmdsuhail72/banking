apiVersion: v2
name: banking-app
description: |
  Banking Platform — complete deployment chart.
  Brings up all 12 microservices, frontend, MongoDB/Redis/Kafka StatefulSets,
  HPAs, PDBs, and Traefik IngressRoute with path-based routing.

type: application
version: 1.0.0
appVersion: "1.0.0"

keywords: [banking, microservices, nestjs, eks]
maintainers:
  - name: Banking Platform Team

dependencies: []
# Traefik is expected to be pre-installed in the cluster (via its own Helm release).
# To install Traefik: helm install traefik traefik/traefik -n traefik --create-namespace
