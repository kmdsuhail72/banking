global:
  # TODO: Replace with your real ECR registry (output of: terraform output ecr_repository_urls)
  registry: "111122223333.dkr.ecr.us-east-1.amazonaws.com"
  imageTag: "latest"
  pullPolicy: IfNotPresent
  namespace: banking

  # AWS — used by External Secrets Operator and IRSA annotations
  clusterName:        "banking-eks-production"       # must match Terraform cluster_name + environment
  awsRegion:          "us-east-1"
  appSecretsRoleArn:  ""   # TODO: set to terraform output app_secrets_role_arn

  otel:
    endpoint: "http://otel-collector.observability.svc.cluster.local:4318"

  # PostgreSQL connection (shared DB, per-service table prefixes)
  postgres:
    host: "postgres-headless"
    port: 5432
    database: "banking"
    user: "banking"

  # Redis connection
  redis:
    host: "redis-headless"
    port: 6379

  # Kafka brokers
  kafka:
    brokers: "kafka-headless:9092"

