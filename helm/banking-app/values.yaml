postgres:
  enabled: true
  image: postgres:17-alpine
  replicas: 1
  port: 5432
  storage: 30Gi
  storageClass: gp3
  database: banking
  user: banking
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { cpu: "1500m", memory: "3Gi" }

redis:
  enabled: true
  image: redis:8-alpine
  replicas: 1
  port: 6379
  storage: 5Gi
  storageClass: gp3
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }


kafka:
  enabled: true
  image: apache/kafka:3.9.0
  replicas: 1
  port: 9092
  storage: 20Gi
  storageClass: gp3
  resources:
    requests: { cpu: "300m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "2Gi" }

