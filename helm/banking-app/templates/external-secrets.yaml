{{/*
  external-secrets.yaml — Banking Platform Helm Chart
  Uses External Secrets Operator (ESO) to sync AWS Secrets Manager secrets
  into Kubernetes Secrets per service. One ExternalSecret per service that
  has a corresponding secret in Secrets Manager.
*/}}

# ── Shared: DB password (Aurora-managed master secret) ───────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: banking-db-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name:             banking-db-secret
    creationPolicy:   Owner
    deletionPolicy:   Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: password
      remoteRef:
        key:      {{ .Values.global.clusterName }}/shared/aurora-master
        property: password

# ── Shared: Redis credentials ─────────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: banking-redis-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name:           banking-redis-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key:      {{ .Values.global.clusterName }}/shared/redis
        property: REDIS_PASSWORD

# ── Per-service secrets (JWT, gateway API keys, etc.) ────────────────────────
{{- $serviceSecretMap := dict
  "auth-service"         "auth-service/jwt"
  "payment-service"      "payment-service/gateway"
  "notification-service" "notification-service/providers"
  "kyc-risk-service"     "kyc-risk-service/providers"
  "fraud-service"        "fraud-service/api-keys"
}}

{{- range $svcName, $secretPath := $serviceSecretMap }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $svcName }}-secrets
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "banking.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svcName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name:           {{ $svcName }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: {{ $.Values.global.clusterName }}/{{ $secretPath }}
{{- end }}

# ── Observability credentials (Grafana, Slack, SMTP) ─────────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name:           observability-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.global.clusterName }}/observability/credentials

# ── ClusterSecretStore: AWS Secrets Manager via IRSA ─────────────────────────
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    {{- include "banking.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service:  SecretsManager
      region:   {{ .Values.global.awsRegion | default "us-east-1" | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name:      eso-sa
            namespace: external-secrets
